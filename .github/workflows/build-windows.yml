name: Build Windows Installer (.exe NSIS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript & frontend suite
        run: npm run typecheck && npm test

      - name: Verify Rust & SQLite backend tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer (.exe)
        run: npm run tauri:build

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: domino-tournament-manager-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installer to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
